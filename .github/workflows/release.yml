# Release：发布时编译固件与安卓 App，并把二进制上传为该 Release 的 assets。
# 产物版本名使用 Release 的 tag（例如 tag v2.1.0 → Passport-OS-V2-v2.1.0.zip）。
name: Release build

on:
  release:
    types: [published]

jobs:
  firmware:
    name: Build firmware (ESP32-C3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32c3
          path: "."
          command: "idf.py build"
      - name: Upload firmware binaries as artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/FoloToy-AI-Passport.bin

  android:
    name: Build Android app (debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK (accept licenses)
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Upload debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk

  release-assets:
    name: Attach binaries to Release
    needs: [firmware, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload binaries to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 版本名取自 Release tag（去首字母 v 便于做文件名）
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"
          ZIP="Passport-OS-V2-${VER}.zip"
          mkdir -p release
          cp artifacts/firmware/bootloader.bin release/
          cp artifacts/firmware/partition-table.bin release/
          cp artifacts/firmware/FoloToy-AI-Passport.bin release/
          cp artifacts/android-apk/app-debug.apk release/
          (cd release && zip -r "../${ZIP}" .)
          gh release upload "$TAG" "$ZIP" --clobber
