# CI：push / PR 时编译验证固件与安卓 App，仅检查能否编译，不产出、不发布。
name: CI build check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    name: Build firmware (ESP32-C3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32c3
          path: "."
          command: "idf.py build"

  android:
    name: Build Android app (debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: actions/setup-android@v4
        with:
          gradle-version: wrapper
      - name: Build debug APK
        run: ./gradlew assembleDebug
