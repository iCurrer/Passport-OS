# Release：发布时编译固件与安卓 App，并把二进制上传为该 Release 的 assets。
# 产物版本名使用 Release 的 tag（例如 tag v2.1.0 → Passport-OS-V2-v2.1.0.zip）。
name: Release build

on:
  release:
    types: [published]

jobs:
  firmware:
    name: Build firmware (ESP32-C3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32c3
          path: "."
          # build 后用 idf.py merge-bin 合并成单个完整 8MB 固件(同一 IDF 环境/项目目录;
          # merge-bin 在 build/ 下执行,所以文件路径不带 build/ 前缀,已验证)
          command: |
            idf.py build
            idf.py merge-bin -o FoloToy-AI-Passport-8M.bin --fill-flash-size 8MB \
              0x0 bootloader/bootloader.bin \
              0x8000 partition_table/partition-table.bin \
              0x10000 FoloToy-AI-Passport.bin
      - name: Upload merged firmware as artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/FoloToy-AI-Passport-8M.bin

  android:
    name: Build Android app (debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK (accept licenses)
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk

  release-assets:
    name: Attach binaries to Release
    needs: [firmware, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 上传 Release assets 需要写权限
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Inspect downloaded artifacts (diagnostic)
        run: |
          echo "--- artifacts tree ---"
          find artifacts -type f 2>/dev/null || echo "(no files found under artifacts/)"
      - name: Upload binaries to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 版本名取自 Release tag（去首字母 v 便于做文件名）
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"
          ZIP="Passport-OS-V2-${VER}.zip"
          mkdir -p release
          # 收集合并固件(单个完整 8M bin) + 安卓 APK;用 find 定位,兼容 download-artifact@v4 目录结构
          cp "$(find artifacts -name 'FoloToy-AI-Passport-8M.bin' | head -n1)" release/
          cp "$(find artifacts -name app-debug.apk | head -n1)" release/
          (cd release && zip -r "../${ZIP}" .)
          # 显式指定仓库(避免 gh 依赖 git 上下文失败),并确保在仓库根执行上传
          gh release upload "$TAG" "$ZIP" -R "$GITHUB_REPOSITORY" --clobber
